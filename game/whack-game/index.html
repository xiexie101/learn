<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#7FE0C3">
<meta property="og:title" content="WHACK!">
<meta property="og:description" content="cel-shaded whack-a-mole in the browser. bonk the cuties, dodge the bombs.">
<meta property="og:image" content="https://whack-game.pages.dev/icons/icon-512.png">
<title>WHACK!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #2B2E4A; --coral: #FF7A6B; --mint: #7FE0C3; --sky: #7CC7FF; --lav: #C9A7FF; --butter: #FFD86B; --cream: #FFF3D6; }
  html, body { margin: 0; height: 100%; height: 100dvh; overflow: hidden; -webkit-touch-callout: none; overscroll-behavior: none; background: #cfe9ff; font-family: 'Fredoka', 'SF Pro Rounded', 'Nunito', 'Arial Rounded MT Bold', system-ui, sans-serif; color: var(--navy); user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; cursor: none; touch-action: none; }
  body.showcursor canvas { cursor: default; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  #hud .top { position: absolute; left: 18px; right: 18px; top: 18px; display: flex; justify-content: space-between; align-items: flex-start; }
  .pill { background: rgba(255,255,255,.82); border: 4px solid var(--navy); border-radius: 22px; padding: 6px 20px; box-shadow: 0 6px 0 var(--navy); font-weight: 700; text-align: center; min-width: 120px; }
  .pill .lbl { font-size: 13px; letter-spacing: .12em; opacity: .65; text-transform: uppercase; }
  .pill .val { font-size: 38px; line-height: 1; }
  #combo { position: absolute; left: 50%; top: 22px; transform: translateX(-50%) scale(0); color: #fff; font-size: 44px; font-weight: 700; -webkit-text-stroke: 3px var(--navy); paint-order: stroke fill; text-shadow: 0 5px 0 var(--navy); transition: transform .18s cubic-bezier(.34,1.56,.64,1); }
  #combo.show { transform: translateX(-50%) scale(1); }
  #combo.wob { animation: wob .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes wob { 0% { transform: translateX(-50%) scale(1.35) rotate(-6deg);} 60% { transform: translateX(-50%) scale(.92) rotate(3deg);} 100% { transform: translateX(-50%) scale(1) rotate(0);} }
  #timer { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(420px, 70vw); height: 24px; background: rgba(255,255,255,.8); border: 4px solid var(--navy); border-radius: 20px; box-shadow: 0 5px 0 var(--navy); overflow: hidden; }
  #timer i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--mint), var(--sky)); border-radius: 12px; transform-origin: left; }
  #timer.low i { background: linear-gradient(90deg, var(--coral), var(--butter)); }
  .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px; background: rgba(255,243,214,.35); backdrop-filter: blur(3px); transition: opacity .3s; }
  .screen.hide { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity .3s, visibility 0s .3s; }
  .screen.hide .btn { pointer-events: none; }
  .title { font-size: clamp(64px, 14vw, 140px); font-weight: 700; color: var(--butter); -webkit-text-stroke: 5px var(--navy); paint-order: stroke fill; text-shadow: 0 10px 0 var(--navy); transform: rotate(-4deg); letter-spacing: .02em; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: rotate(-4deg) translateY(0);} 50% { transform: rotate(-3deg) translateY(-10px);} }
  .sub { font-size: 22px; font-weight: 600; opacity: .8; }
  .btn { pointer-events: auto; cursor: pointer; font: inherit; font-weight: 700; font-size: 34px; color: #fff; background: var(--coral); border: 5px solid var(--navy); border-radius: 999px; padding: 14px 54px; box-shadow: 0 8px 0 var(--navy); -webkit-text-stroke: 1.5px var(--navy); paint-order: stroke fill; transition: transform .1s, box-shadow .1s; }
  .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 11px 0 var(--navy); }
  .btn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--navy); }
  .btn.small { font-size: 16px; padding: 8px 18px; border-width: 3px; box-shadow: 0 4px 0 var(--navy); }
  .btn.small:hover { box-shadow: 0 6px 0 var(--navy); }
  .btn.small:active { box-shadow: 0 1px 0 var(--navy); }
  .card { background: rgba(255,255,255,.9); border: 5px solid var(--navy); border-radius: 30px; padding: 26px 44px; box-shadow: 0 10px 0 var(--navy); text-align: center; }
  .card .big { font-size: 72px; font-weight: 700; line-height: 1; }
  .card .best { font-size: 20px; opacity: .7; margin-top: 6px; }
  #tools { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 8px; pointer-events: auto; }
  #rec.on { background: #d33; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .5; } }
  #hint { position: fixed; left: 16px; bottom: 16px; font-size: 13px; opacity: .55; }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #cfe9ff; font-size: 26px; font-weight: 700; transition: opacity .4s; z-index: 5; }
  #loading.hide { opacity: 0; pointer-events: none; }
  body.cinema #hud, body.cinema #tools, body.cinema #hint { display: none; }
  body.capture #tools, body.capture #hint { display: none; }
  body.capture { cursor: none; }
  #timer { bottom: calc(26px + env(safe-area-inset-bottom, 0px)); }
  #tools { bottom: calc(14px + env(safe-area-inset-bottom, 0px)); right: calc(14px + env(safe-area-inset-right, 0px)); }
  #hud .top { top: calc(18px + env(safe-area-inset-top, 0px)); left: calc(18px + env(safe-area-inset-left, 0px)); right: calc(18px + env(safe-area-inset-right, 0px)); }
  html.touch #hint { display: none; }
  @media (max-width: 640px), (max-height: 480px) {
    #hud .top { top: calc(10px + env(safe-area-inset-top, 0px)); left: 10px; right: 10px; }
    .pill { min-width: 74px; padding: 4px 12px; border-width: 3px; border-radius: 16px; box-shadow: 0 4px 0 var(--navy); }
    .pill .lbl { font-size: 10px; }
    .pill .val { font-size: 26px; }
    #combo { top: calc(14px + env(safe-area-inset-top, 0px)); font-size: 30px; -webkit-text-stroke: 2px var(--navy); text-shadow: 0 3px 0 var(--navy); }
    #timer { height: 18px; border-width: 3px; width: min(320px, 64vw); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
    .title { font-size: clamp(52px, 17vw, 96px); -webkit-text-stroke: 4px var(--navy); text-shadow: 0 7px 0 var(--navy); }
    .sub { font-size: 16px; padding: 0 24px; text-align: center; }
    .btn { font-size: clamp(22px, 7vw, 30px); padding: 10px 38px; border-width: 4px; box-shadow: 0 6px 0 var(--navy); }
    .btn.small { font-size: 13px; padding: 6px 12px; border-width: 3px; box-shadow: 0 3px 0 var(--navy); }
    .card { padding: 18px 30px; border-width: 4px; border-radius: 22px; box-shadow: 0 7px 0 var(--navy); }
    .card .big { font-size: 54px; }
    .card .best { font-size: 16px; }
    .screen { gap: 14px; }
    #tools { bottom: calc(52px + env(safe-area-inset-bottom, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); }
    #hint { display: none; }
  }
  #tools { display: none; }
  body.dev #tools { display: flex; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading">loading…</div>
<div id="hud">
  <div class="top">
    <div class="pill"><div class="lbl">score</div><div class="val" id="score">0</div></div>
    <div class="pill"><div class="lbl">best</div><div class="val" id="best">0</div></div>
  </div>
  <div id="combo">x2</div>
  <div id="timer"><i></i></div>
</div>
<div id="start" class="screen">
  <div class="title">WHACK!</div>
  <div class="sub">bonk the cuties. dodge the bombs.</div>
  <button class="btn" id="play">PLAY</button>
</div>
<div id="end" class="screen hide">
  <div class="card"><div class="lbl">score</div><div class="big" id="final">0</div><div class="best" id="finalBest">best 0</div></div>
  <button class="btn" id="again">AGAIN</button>
</div>
<div id="tools"><button class="btn small" id="rec">● rec 20s</button></div>
<div id="hint">click / tap to whack · 1–9 keys</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>INKFALL · 墨水雨 🖋️</title>
    <meta name="description" content="墨水雨：一款用圆珠笔绘制的火柴人射击游戏，敌人会爆裂成五彩缤纷的颜料。跳上笔记本塔，在子弹中空中冲刺，决战墨水之神。">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="arcade-container">
        <!-- ================= TOP STATUS BAR ================= -->
        <header class="top-bar">
            <div class="top-nav">
                <div class="title-logo">
                    墨水雨 · INKFALL <span class="title-slash">/</span>
                </div>
                <div class="nav-actions">
                    <button class="icon-btn" id="btn-sound" title="切换音效">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    </button>
                    <button class="icon-btn" id="btn-fullscreen" title="全屏">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
                    </button>
                    <button class="icon-btn" id="btn-pause" title="暂停">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="3" height="16"></rect><rect x="15" y="4" width="3" height="16"></rect></svg>
                    </button>
                </div>
            </div>

            <div class="status-grid">
                <div class="status-left">
                    <div class="vitals-row">
                        <span class="vitals-label">生命值</span>
                        <span class="vitals-val" id="vitals-val">100 / 100</span>
                    </div>
                    <div class="vitals-bar-track">
                        <div class="vitals-bar-fill" id="vitals-bar-fill"></div>
                    </div>

                    <div class="sub-meters">
                        <div class="focus-gauge-wrapper">
                            <span>专注</span>
                            <div class="focus-bar-track">
                                <div class="focus-bar-fill" id="focus-bar-fill"></div>
                            </div>
                        </div>
                        <span id="dash-status">冲刺就绪</span>
                    </div>

                    <div class="ascent-row">
                        <span id="ascent-label">↑ 攀登高度</span>
                        <span id="ascent-val">1 / 300m</span>
                    </div>

                    <div class="boss-bar-track hidden" id="boss-bar-container">
                        <div class="boss-phase-marker boss-marker-1"></div>
                        <div class="boss-phase-marker boss-marker-2"></div>
                        <div class="boss-bar-fill" id="boss-bar-fill"></div>
                    </div>
                </div>

                <div class="status-right">
                    <span class="zone-tag" id="zone-tag">01 / 纸基底层</span>
                    <div class="score-display" id="score-val">000000</div>
                    <span class="state-badge" id="state-badge">纸基底层</span>
                </div>
            </div>
        </header>

        <!-- ================= PLAYFIELD VIEWPORT ================= -->
        <main class="game-viewport">
            <div id="game-canvas-container"></div>

            <!-- Center Banner Announcement -->
            <div class="center-banner" id="center-banner">
                <div class="banner-title" id="banner-title">纸基底层</div>
                <div class="banner-sub" id="banner-sub">命中敌人为超载充能，空中冲刺反弹子弹。</div>
            </div>
        </main>

        <!-- ================= BOTTOM CONTROL DECK ================= -->
        <footer class="control-deck">
            <!-- Surge / Ripper Slider -->
            <div class="surge-console" id="surge-container" title="点击或按 E 释放超载爆发">
                <div class="surge-meta">
                    <span class="surge-val" id="surge-val">超载爆发 25%</span>
                    <span class="surge-name">撕裂者连发</span>
                </div>
                <div class="surge-track-wrapper">
                    <div class="surge-track"></div>
                    <div class="surge-fill-bar" id="surge-fill"></div>
                    <div class="surge-knob" id="surge-knob"></div>
                </div>
            </div>

            <!-- Lower Controls: Left Joystick, Right Action Grid -->
            <div class="deck-lower">
                <!-- Left: Steer / D-pad Console -->
                <div class="joystick-console">
                    <div class="joystick-ring" id="joystick-ring">
                        <span class="dpad-arrow arrow-up">↑</span>
                        <span class="dpad-arrow arrow-down">↓</span>
                        <span class="dpad-arrow arrow-left">←</span>
                        <span class="dpad-arrow arrow-right">→</span>
                        <div class="joystick-knob" id="joystick-knob"></div>
                    </div>
                    <div class="joystick-labels">
                        <div class="label-main">冲刺转向</div>
                        <div class="label-sub">↓ 下蹲 / 滑铲</div>
                    </div>
                </div>

                <!-- Right: 2x2 Tactile Action Buttons -->
                <div class="button-grid">
                    <!-- Button 1: Focus (Slo-Mo) -->
                    <button class="action-btn" id="btn-focus">
                        <span class="btn-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="1" x2="12" y2="4"></line></svg>
                        </span>
                        <span class="btn-title">专注</span>
                        <span class="btn-sub">子弹时间</span>
                    </button>

                    <!-- Button 2: Dash (Reflect) -->
                    <button class="action-btn" id="btn-dash">
                        <span class="btn-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="13 17 18 12 13 7"></polyline><polyline points="6 17 11 12 6 7"></polyline></svg>
                        </span>
                        <span class="btn-title">冲刺</span>
                        <span class="btn-sub">转向 + 点击</span>
                    </button>

                    <!-- Button 3: Fire (Auto/Manual) -->
                    <button class="action-btn fire-btn" id="btn-fire">
                        <span class="btn-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="3" x2="12" y2="7"></line><line x1="12" y1="17" x2="12" y2="21"></line><line x1="3" y1="12" x2="7" y2="12"></line><line x1="17" y1="12" x2="21" y2="12"></line></svg>
                        </span>
                        <span class="btn-title">开火</span>
                        <span class="btn-sub">自动 • 点击切换</span>
                    </button>

                    <!-- Button 4: Jump (Double / Wall) -->
                    <button class="action-btn" id="btn-jump">
                        <span class="btn-icon">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                        </span>
                        <span class="btn-title">跳跃</span>
                        <span class="btn-sub">连点 ×2 二段跳</span>
                    </button>
                </div>
            </div>

            <div class="keyboard-hint">
                键盘快捷键: WASD/方向键移动 · 空格跳跃/滑墙跳 · Shift/右键冲刺反弹 · F子弹时间 · E超载爆发
            </div>
        </footer>
    </div>

    <!-- Three.js: Local with CDN Fallback -->
    <script src="three.min.js"></script>
    <script>
        if (typeof THREE === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');
        }
    </script>

    <!-- Game Subsystems -->
    <script src="src/audio.js"></script>
    <script src="src/particles.js"></script>
    <script src="src/stickman.js"></script>
    <script src="src/boss.js"></script>
    <script src="src/game.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>甄嬛传 - 人物关系图谱</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- 头部信息区 -->
        <header>
            <div class="title-area">
                <h1>甄嬛传</h1>
                <p>后宫群像 · 人物关系图谱</p>
            </div>
            <div class="stats-area">
                <div class="stat-item"><div class="stat-value">143</div><div class="stat-label">章 回</div></div>
                <div class="stat-item"><div class="stat-value">160万</div><div class="stat-label">字 数</div></div>
                <div class="stat-item"><div class="stat-value" id="stat-chars">8</div><div class="stat-label">主要人物</div></div>
                <div class="stat-item"><div class="stat-value">25,375</div><div class="stat-label">共现段落</div></div>
                <div class="stat-item"><div class="stat-value" id="stat-events">38</div><div class="stat-label">关键事件</div></div>
            </div>
        </header>

        <!-- 人物志：横向滚动卡片 -->
        <section class="gallery-section">
            <div class="section-header">
                <h2>人物志</h2>
                <span>点击卡片查看详细小传</span>
            </div>
            <div class="gallery-container" id="character-gallery">
                <!-- 由 JS 动态渲染 -->
            </div>
        </section>

        <!-- 核心工作区：左图右概览 -->
        <section class="workspace">
            <div class="panel graph-panel">
                <div class="section-header">
                    <h2>人物关系网络</h2>
                    <span>点击节点高亮关联 · 双击恢复</span>
                </div>
                <div id="graph-container"></div>
            </div>

            <div class="panel details-panel">
                <div class="section-header">
                    <h2 id="details-title">人物出场概率</h2>
                    <span id="details-subtitle">全文提及次数</span>
                </div>
                
                <div class="content-wrapper" id="details-content">
                    <!-- 默认显示柱状图 -->
                    <div id="default-chart"></div>
                    
                    <!-- 选中人物后显示时间线（初始隐藏） -->
                    <div id="character-detail" style="display: none;">
                        <div class="char-header-detail">
                            <img id="detail-img" src="" alt="avatar">
                            <div>
                                <h3 id="detail-name">姓名</h3>
                                <p id="detail-actor">演员</p>
                            </div>
                        </div>
                        <div id="detail-bio" class="char-bio"></div>
                        <div id="detail-timeline" class="timeline">
                            <!-- 动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Flash TTS - AI Voice Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js" crossorigin></script>
    <style>
        :root {
            --primary: #0668E1;
            --primary-hover: #0555B8;
            --bg: #F8FAFC;
            --surface: #FFFFFF;
            --text-heading: #0F172A;
            --text-body: #475569;
            --accent: #10B981;
            --border: #E2E8F0;
            --radius-lg: 12px;
            --radius-md: 8px;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-body);
            line-height: 1.5;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--text-heading);
            font-size: 2.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: var(--text-body);
            font-size: 1rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-heading);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-heading);
            margin-bottom: 0.5rem;
        }

        input[type="text"], 
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 0.9375rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            background-color: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(6, 104, 225, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .speaker-row {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
            align-items: center;
        }

        .btn-remove {
            background: none;
            border: none;
            color: #EF4444;
            cursor: pointer;
            padding: 0.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .btn-remove:hover {
            background: #FEF2F2;
        }

        .btn-add {
            background: none;
            border: 1px dashed var(--border);
            color: var(--primary);
            cursor: pointer;
            padding: 0.5rem;
            width: 100%;
            border-radius: var(--radius-md);
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 0.5rem;
        }

        .btn-add:hover {
            background: #F1F5F9;
            border-color: var(--primary);
        }

        textarea {
            min-height: 200px;
            resize: vertical;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-primary:disabled {
            background-color: var(--border);
            cursor: not-allowed;
        }

        .output-card {
            border-left: 4px solid var(--accent);
        }

        .audio-player {
            width: 100%;
            margin-top: 1rem;
        }

        .download-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .download-link:hover {
            text-decoration: underline;
        }

        .status {
            font-size: 0.875rem;
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            display: none;
        }

        .status.loading {
            display: block;
            background: #EFF6FF;
            color: var(--primary);
        }

        .status.error {
            display: block;
            background: #FEF2F2;
            color: #EF4444;
        }

        .tag {
            display: inline-block;
            padding: 0.125rem 0.375rem;
            background: #F1F5F9;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: monospace;
            color: var(--text-body);
        }

        .instructions {
            font-size: 0.8125rem;
            color: var(--text-body);
            margin-top: 0.5rem;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const VOICES = ["Puck", "Charon", "Kore", "Fenrir", "Aoede", "Zephyr"];

        const DEFAULT_SINGLE_TEXT = `This is a test of the Gemini Flash text to speech API. 

I can speak with different emotions. Say [cheerfully]: I'm so happy to be here! 
Or [sadly]: I'm not feeling very well today.

I can also whisper. [whisper] Can you hear me now?

[short pause] And I can take breaks between sentences.`;

        const DEFAULT_MULTI_TEXT = `Joe: Hey Jane, have you seen the new Gemini 3.1 Flash TTS model?
Jane: I have! It sounds incredibly natural, doesn't it?
Joe: Absolutely. The multi-speaker support is a game changer for podcasts and audiobooks.
Jane: [excitedly] And it's so fast too! I can generate minutes of audio in seconds.`;

        function App() {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
            const [mode, setMode] = useState('single');
            const [singleVoice, setSingleVoice] = useState('Puck');
            const [speakers, setSpeakers] = useState([
                { name: 'Joe', voice: 'Puck' },
                { name: 'Jane', voice: 'Kore' }
            ]);
            const [text, setText] = useState(DEFAULT_SINGLE_TEXT);
            const [isLoading, setIsLoading] = useState(false);
            const [error, setError] = useState(null);
            const [audioUrl, setAudioUrl] = useState(null);
            const [downloadUrl, setDownloadUrl] = useState(null);

            useEffect(() => {
                localStorage.setItem('gemini_api_key', apiKey);
            }, [apiKey]);

            const handleModeChange = (newMode) => {
                setMode(newMode);
                setText(newMode === 'single' ? DEFAULT_SINGLE_TEXT : DEFAULT_MULTI_TEXT);
                setAudioUrl(null);
                setDownloadUrl(null);
            };

            const addSpeaker = () => {
                setSpeakers([...speakers, { name: '', voice: 'Puck' }]);
            };

            const updateSpeaker = (index, field, value) => {
                const newSpeakers = [...speakers];
                newSpeakers[index][field] = value;
                setSpeakers(newSpeakers);
            };

            const removeSpeaker = (index) => {
                setSpeakers(speakers.filter((_, i) => i !== index));
            };

            const createWavBlobFromPcmBase64 = (base64Data, sampleRate = 24000, numChannels = 1, bitsPerSample = 16) => {
                const binaryString = atob(base64Data);
                const dataSize = binaryString.length;
                const buffer = new ArrayBuffer(44 + dataSize);
                const view = new DataView(buffer);

                const writeString = (offset, str) => {
                    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
                };

                writeString(0, 'RIFF');
                view.setUint32(4, 36 + dataSize, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, 1, true); // PCM format
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * bitsPerSample / 8, true);
                view.setUint16(32, numChannels * bitsPerSample / 8, true);
                view.setUint16(34, bitsPerSample, true);
                writeString(36, 'data');
                view.setUint32(40, dataSize, true);

                const pcmData = new Uint8Array(buffer, 44);
                for (let i = 0; i < dataSize; i++) pcmData[i] = binaryString.charCodeAt(i);

                return new Blob([buffer], { type: 'audio/wav' });
            };

            const generateAudio = async () => {
                if (!apiKey) {
                    setError('Please enter your Gemini API Key');
                    return;
                }

                setIsLoading(true);
                setError(null);
                setAudioUrl(null);
                setDownloadUrl(null);

                try {
                    let speechConfig;
                    if (mode === 'single') {
                        speechConfig = {
                            voiceConfig: {
                                prebuiltVoiceConfig: {
                                    voiceName: singleVoice
                                }
                            }
                        };
                    } else {
                        speechConfig = {
                            multiSpeakerVoiceConfig: {
                                speakerVoiceConfigs: speakers.filter(s => s.name.trim()).map(s => ({
                                    speaker: s.name,
                                    voiceConfig: {
                                        prebuiltVoiceConfig: {
                                            voiceName: s.voice
                                        }
                                    }
                                }))
                            }
                        };
                    }

                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            generationConfig: {
                                responseModalities: ["AUDIO"],
                                speechConfig: speechConfig
                            }
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || 'Failed to generate audio');
                    }

                    const data = await response.json();
                    
                    // Find the audio data in the response
                    const audioPart = data.candidates?.[0]?.content?.parts?.find(p => p.inlineData?.mimeType === 'audio/pcm');
                    
                    if (!audioPart) {
                        throw new Error('No audio data returned from API');
                    }

                    const blob = createWavBlobFromPcmBase64(audioPart.inlineData.data);
                    const url = URL.createObjectURL(blob);
                    setAudioUrl(url);
                    setDownloadUrl(url);

                } catch (err) {
                    setError(err.message);
                    console.error(err);
                } finally {
                    setIsLoading(false);
                }
            };

            return (
                <div className="container">
                    <header>
                        <h1>Gemini Flash TTS</h1>
                        <p className="subtitle">Transform text into natural-sounding speech with Gemini 2.0 Flash</p>
                    </header>

                    <div className="card">
                        <div className="section-title">🔑 API Configuration</div>
                        <div className="form-group">
                            <label htmlFor="api-key">Gemini API Key</label>
                            <input 
                                type="password" 
                                id="api-key" 
                                placeholder="Enter your Google AI Studio API Key"
                                value={apiKey}
                                onChange={(e) => setApiKey(e.target.value)}
                            />
                            <p className="instructions">Get your key from <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">Google AI Studio</a></p>
                        </div>
                    </div>

                    <div className="card">
                        <div className="section-title">🎙️ Voice Settings</div>
                        
                        <div className="form-group">
                            <label>Speech Mode</label>
                            <div className="grid">
                                <button 
                                    className={`btn-add ${mode === 'single' ? 'active' : ''}`}
                                    style={{ 
                                        border: mode === 'single' ? '2px solid var(--primary)' : '1px solid var(--border)',
                                        background: mode === 'single' ? '#EFF6FF' : 'none'
                                    }}
                                    onClick={() => handleModeChange('single')}
                                >
                                    Single Speaker
                                </button>
                                <button 
                                    className={`btn-add ${mode === 'multi' ? 'active' : ''}`}
                                    style={{ 
                                        border: mode === 'multi' ? '2px solid var(--primary)' : '1px solid var(--border)',
                                        background: mode === 'multi' ? '#EFF6FF' : 'none'
                                    }}
                                    onClick={() => handleModeChange('multi')}
                                >
                                    Multi-Speaker
                                </button>
                            </div>
                        </div>

                        {mode === 'single' ? (
                            <div className="form-group">
                                <label htmlFor="voice">Voice Selection</label>
                                <select 
                                    id="voice" 
                                    value={singleVoice}
                                    onChange={(e) => setSingleVoice(e.target.value)}
                                >
                                    {VOICES.map(v => <option key={v} value={v}>{v}</option>)}
                                </select>
                            </div>
                        ) : (
                            <div className="form-group">
                                <label>Configure Speakers</label>
                                {speakers.map((s, i) => (
                                    <div key={i} className="speaker-row">
                                        <input 
                                            type="text" 
                                            placeholder="Name (e.g. Joe)" 
                                            value={s.name}
                                            onChange={(e) => updateSpeaker(i, 'name', e.target.value)}
                                            style={{ flex: 1 }}
                                        />
                                        <select 
                                            value={s.voice}
                                            onChange={(e) => updateSpeaker(i, 'voice', e.target.value)}
                                            style={{ width: '120px' }}
                                        >
                                            {VOICES.map(v => <option key={v} value={v}>{v}</option>)}
                                        </select>
                                        <button className="btn-remove" onClick={() => removeSpeaker(i)}>
                                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                                        </button>
                                    </div>
                                ))}
                                <button className="btn-add" onClick={addSpeaker}>+ Add Speaker</button>
                            </div>
                        )}
                    </div>

                    <div className="card">
                        <div className="section-title">📝 Script</div>
                        <div className="form-group">
                            <label htmlFor="text">Text to Speak</label>
                            <textarea 
                                id="text" 
                                value={text}
                                onChange={(e) => setText(e.target.value)}
                                placeholder={mode === 'single' ? "Enter text here..." : "Speaker: Text..."}
                            ></textarea>
                            <div className="instructions">
                                {mode === 'single' ? (
                                    <span>Tip: Use <span className="tag">[cheerfully]</span>, <span className="tag">[whisper]</span>, or <span className="tag">[short pause]</span> to control the voice.</span>
                                ) : (
                                    <span>Format: Start lines with <span className="tag">Name:</span> as defined in voice settings.</span>
                                )}
                            </div>
                        </div>
                        <button 
                            className="btn-primary" 
                            onClick={generateAudio}
                            disabled={isLoading || !text.trim()}
                        >
                            {isLoading ? 'Generating Audio...' : 'Generate Audio'}
                        </button>

                        {error && <div className="status error">{error}</div>}
                        {isLoading && <div className="status loading">Processing audio request... This may take a few seconds.</div>}
                    </div>

                    {audioUrl && (
                        <div className="card output-card">
                            <div className="section-title">🔊 Output</div>
                            <audio className="audio-player" controls src={audioUrl}>
                                Your browser does not support the audio element.
                            </audio>
                            <a href={downloadUrl} download="gemini-audio.wav" className="download-link">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Download WAV Audio
                            </a>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

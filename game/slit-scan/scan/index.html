    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #E0E8D5;
      --ink: #0a0a0a;
      --red: #e8380d;
      --border: #c8c6ae;
      --gray: #888;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── LAYOUT ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ── HEADER ── */
    .header {
      flex-shrink: 0;
      text-align: center;
      padding: 24px 40px 16px;
      background-image:
        linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .header-title {
      font-family: "Inktoner", serif;
      font-size: clamp(32px, 5vw, 56px);
      font-weight: normal;
      line-height: 1;
      margin-bottom: 16px;
    }

    .header-buttons {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
    }

    .hbtn {
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink);
      background: transparent;
      border: 1.5px solid var(--ink);
      padding: 8px 22px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .hbtn:hover { background: var(--ink); color: var(--bg); }
    .hbtn.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .hbtn.active:hover { background: #333; border-color: #333; }

    /* ── SCAN PANELS ── */
    .scan-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 48px;
      padding: 12px 10vw 20px;
      min-height: 0;
      overflow: hidden;
      background-image:
        linear-gradient(rgba(0,0,0,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .scan-panel {
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      cursor: grab;
      /* Height-driven: panels shrink to fit screen height */
      height: calc((100vh - 160px) * 0.95);
      aspect-ratio: 3 / 4;
      max-width: calc((50vw - 10vw - 12px) * 0.95);
      flex-shrink: 1;
      min-height: 0;
    }

    /* panel label */
    .panel-label-text {
      position: absolute;
      top: 10px;
      left: 12px;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      color: var(--ink);
      pointer-events: none;
      z-index: 5;
      letter-spacing: 0.02em;
    }
    .scan-label-block .panel-label-text {
      position: static;
    }

      margin-top: 8px;
      background: var(--bg);
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      padding: 10px 18px;
      display: none;
      align-items: center;
      gap: 12px;
      z-index: 100;
      font-family: "Inter", sans-serif;
      font-size: 14px;
      font-weight: 400;
    }
    .speed-popover.open { display: flex; }
    .speed-popover input[type=range] {
      width: 120px;
      accent-color: var(--ink);
    }
    .speed-val { color: var(--ink); font-weight: 700; min-width: 20px; }

    /* ── RESULT OVERLAY ── */
    #resultOverlay {
      position: fixed; inset: 0;
      background: #D5E4E8;
      display: flex; flex-direction: column; align-items: center;
      z-index: 200; opacity: 0; pointer-events: none;
      overflow: hidden;
      background-image:
        linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    #resultOverlay.open { opacity: 1; pointer-events: all; }
    .result-header { text-align: center; padding: 24px 0 10px; flex-shrink: 0; }
    .result-title { font-family: "Inktoner", serif; font-size: clamp(28px, 4vw, 48px); font-weight: normal; color: var(--ink); margin-bottom: 14px; }
    .result-buttons { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; position: relative; z-index: 10; }
    .rbtn { font-family: "Inter", sans-serif; font-size: 14px; font-weight: 400; padding: 8px 22px; border-radius: 6px; cursor: pointer; transition: all 0.15s; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); }
    .rbtn:hover { background: var(--ink); color: #D5E4E8; }
    .rbtn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .rbtn.primary:hover { background: #333; border-color: #333; }
    .rbtn.active { background: var(--ink); color: #D5E4E8; }
    .color-bar { display: none; align-items: center; justify-content: center; gap: 12px; padding: 10px 0 4px; flex-shrink: 0; position: relative; z-index: 10; }
    .brush-group {
      display: flex; align-items: center; gap: 8px;
      border: 1.5px solid var(--ink); border-radius: 6px;
      padding: 4px 14px; height: 38px;
    }
    .brush-label { font-family: "Inter", sans-serif; font-size: 14px; color: var(--ink); }
    .brush-slider { width: 80px; accent-color: var(--ink); }
    .eraser-btn {
      font-family: "Inter", sans-serif; font-size: 14px; font-weight: 400;
      padding: 4px 14px; border-radius: 6px; cursor: pointer;
      border: 1.5px solid var(--ink); background: transparent; color: var(--ink);
      height: 38px; transition: all 0.15s;
    }
    .eraser-btn.active { background: var(--ink); color: #D5E4E8; }
    .eraser-btn:hover { background: var(--ink); color: #D5E4E8; }
    .color-bar.open { display: flex; }
    .picker-group {
      display: flex; align-items: center; gap: 8px;
      border: 1.5px solid var(--ink); border-radius: 6px;
      padding: 4px 14px; cursor: pointer;
      height: 38px;
    }
    .picker-label {
      font-family: "Inter", sans-serif; font-size: 14px;
      color: var(--ink); pointer-events: none;
    }
    .color-input {
      -webkit-appearance: none; appearance: none;
      width: 22px; height: 22px; border: none; padding: 0;
      border-radius: 50%; cursor: pointer; background: transparent;
    }
    .color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .color-input::-webkit-color-swatch { border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.15); }
    .color-input::-moz-color-swatch { border-radius: 50%; border: 1.5px solid rgba(0,0,0,0.15); }
    .result-body { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 8px 40px 24px; overflow: hidden; }
    .result-canvas-wrap { position: relative; max-width: 100%; flex-shrink: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
    #resultCanvas { max-width: 90%; max-height: calc((100vh - 240px) * 0.9); object-fit: contain; display: block; border-radius: 4px; }
    #doodleCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: default; pointer-events: none; }
    #doodleCanvas.active { cursor: crosshair; pointer-events: all; }
    .copy-toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #D5E4E8; font-family: "Inter", sans-serif; font-size: 13px; padding: 10px 20px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; z-index: 300; }
    .copy-toast.show { opacity: 1; }
    /* ── UPLOAD MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      z-index: 400;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #fff; border-radius: 12px; padding: 32px;
      max-width: 420px; width: 90vw; position: relative;
      text-align: center;
    }
    .modal-close {
      position: absolute; top: 12px; right: 16px;
      background: none; border: none; font-size: 24px;
      cursor: pointer; color: #888; line-height: 1;
    }
    .modal-close:hover { color: var(--ink); }
    .modal-title {
      font-family: "Inktoner", serif; font-size: 24px;
      font-weight: normal; margin-bottom: 20px;
    }
    #modalPreview {
      max-width: 100%; max-height: 260px; object-fit: contain;
      border-radius: 6px; margin-bottom: 20px; display: block;
      margin-left: auto; margin-right: auto;
    }
    .modal-form {
      display: flex; gap: 10px; align-items: center;
      justify-content: center;
    }
    .modal-input {
      font-family: "Inter", sans-serif; font-size: 14px;
      border: 1.5px solid #ccc; border-radius: 6px;
      padding: 8px 14px; flex: 1; outline: none;
      transition: border-color 0.15s;
    }
    .modal-input:focus { border-color: var(--ink); }
    .modal-submit { white-space: nowrap; flex-shrink: 0; }
    .modal-status {
      font-family: "Inter", sans-serif; font-size: 13px;
      color: var(--gray); margin-top: 14px; min-height: 20px;
    }


    /* ── MOBILE: stack panels vertically, scan at bottom ── */
    @media (max-width: 768px) {
      html, body { overflow-y: auto; height: auto; }
      .app { height: auto; min-height: 100vh; }
      .color-bar {
        flex-wrap: wrap;
        gap: 8px 10px;
        max-width: 280px;
        margin: 0 auto;
      }
      .scan-body {
        flex-direction: column;
        gap: 16px;
        padding: 12px 20px 32px;
        overflow-y: auto;
        justify-content: flex-start;
      }
      .scan-panel {
        height: auto;
        width: 100%;
        max-width: min(62vw, 280px);
        aspect-ratio: 3 / 4;
        flex-shrink: 0;
      }
      /* Preview on top, Scan (bed) on bottom */
      .scan-panel-output { order: 1; }
      #bedContainer { order: 2; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <h1 class="header-title"><a href="../" style="text-decoration:none;color:inherit;">Let&rsquo;s Scan!</a></h1>
    <div class="header-buttons">
      <label class="hbtn">
        更换图片
        <input type="file" id="fileInput" accept="image/*" style="display:none">
      </label>
      <button class="hbtn" id="clearBtn">清空画布</button>
      <div style="position:relative;">
        <button class="hbtn" id="speedBtn">速度</button>
        <div class="speed-popover" id="speedPopover">
        速度
        <input type="range" id="speedSlider" min="1" max="6" value="2">
        <span class="speed-val" id="speedVal">2</span>
        </div>
      </div>
      <button class="hbtn active" id="finishBtn">完成</button>
    </div>
  </div>

  <!-- SCAN PANELS -->
  <div class="scan-body">
    <div class="scan-panel" id="bedContainer">
      <div class="scan-label-block" id="scanLabelBlock">
        <span class="panel-label-text">扫描台</span>
        <span class="scan-hint-inline" id="gestureHint">拖拽移动或双指缩放即可开始扫描</span>
      </div>
      <canvas id="bedCanvas"></canvas>
    </div>
    <div class="scan-panel scan-panel-output">
      <span class="panel-label-text">实时预览</span>
      <canvas id="outputCanvas"></canvas>
    </div>
  </div>

</div>

<!-- RESULT OVERLAY -->
<div id="resultOverlay">
  <div class="result-header">
    <h1 class="result-title"><a href="../" style="text-decoration:none;color:inherit;cursor:pointer;">Let's Scan!</a></h1>
    <div class="result-buttons">
      <button class="rbtn" id="scanAgainBtn">重新扫描</button>
      <button class="rbtn" id="doodleToggle">涂鸦</button>
      <button class="rbtn" id="downloadBtn">下载保存</button>
      <button class="rbtn primary" id="uploadGalleryBtn">存入画廊</button>
    </div>
  </div>
  <div class="color-bar" id="colorBar">
    <label class="picker-group">
      <span class="picker-label">画笔</span>
      <input type="color" id="penColorPicker" value="#ffffff" class="color-input">
    </label>
    <label class="picker-group">
      <span class="picker-label">底色</span>
      <input type="color" id="bgColorPicker" value="#D5E4E8" class="color-input">
    </label>
    <div class="brush-group">
      <span class="brush-label">粗细</span>
      <input type="range" class="brush-slider" id="brushSize" min="1" max="40" value="4">
    </div>
    <button class="eraser-btn" id="eraserBtn">橡皮擦</button>
  </div>
  <div class="result-body">
    <div class="result-canvas-wrap" id="resultWrap">
      <canvas id="resultCanvas"></canvas>
      <canvas id="doodleCanvas"></canvas>
    </div>
  </div>
  <div class="copy-toast" id="copyToast">已复制到剪贴板！</div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">&times;</button>
    <h2 class="modal-title">存入画廊</h2>
    <canvas id="modalPreview"></canvas>
    <div class="modal-form">
      <input type="text" id="artistName" class="modal-input" placeholder="输入作品名称或作者名" maxlength="40" autocomplete="off">
      <button class="rbtn primary modal-submit" id="submitUpload">保存</button>
    </div>
    <div class="modal-status" id="uploadStatus"></div>
  </div>
</div>

<script src="../js/gsap.min.js"></script>
<script>if (typeof gsap === 'undefined') document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"><\/script>');</script>
<script>
(function() {

  const bedCanvas    = document.getElementById('bedCanvas');
  const bedCtx       = bedCanvas.getContext('2d', { willReadFrequently: true });
  const outputCanvas = document.getElementById('outputCanvas');
  const outputCtx    = outputCanvas.getContext('2d', { willReadFrequently: true });
  const resultCanvas = document.getElementById('resultCanvas');
  const resultCtx    = resultCanvas.getContext('2d');
  const offCanvas    = document.createElement('canvas');
  const offCtx       = offCanvas.getContext('2d', { willReadFrequently: true });

  const W = 1200, H = 1500;
  [bedCanvas, outputCanvas, offCanvas].forEach(c => { c.width = W; c.height = H; });
  resultCanvas.width = W; resultCanvas.height = H;
  outputCtx.clearRect(0, 0, W, H);

  const state = {
    img: new Image(), imgLoaded: false,
    x: W/2, y: H/2, scale: 0.85, rotation: 0,
    prevX: W/2, prevY: H/2, prevScale: 0.85, prevRotation: 0,
    isDragging: false, dragStartX: 0, dragStartY: 0,
    scanning: true, scanPos: 0, speed: 2, paused: false,
  };

  // Load default image
  state.img.onload = () => {
    state.imgLoaded = true;
    const scaleW = (W * 0.7) / state.img.width;
    const scaleH = (H * 0.7) / state.img.height;
    state.scale = Math.min(scaleW, scaleH, 1);
  };
  state.img.onerror = () => {
    if (!state.img.src.includes('../image/')) {
      state.img.src = '../image/scan.png';
    }
  };
  state.img.src = '../image/scan.png';

  // ── file upload ──
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      state.img.src = ev.target.result;
      state.img.onload = () => {
        state.imgLoaded = true;
        state.x = W/2; state.y = H/2; state.rotation = 0;
        // Fit image to canvas with some padding
        const scaleW = (W * 0.7) / state.img.width;
        const scaleH = (H * 0.7) / state.img.height;
        state.scale = Math.min(scaleW, scaleH, 1);
        document.getElementById('gestureHint').style.opacity = '0';
        outputCtx.clearRect(0, 0, W, H);
        state.scanPos = 0;
      };
    };
    reader.readAsDataURL(file);
  });

  // ── clear ──
  document.getElementById('clearBtn').addEventListener('click', () => {
    outputCtx.clearRect(0, 0, W, H);
    state.scanPos = 0;
    state.paused = false;
  });

  // ── speed ──
  const speedPopover = document.getElementById('speedPopover');
  document.getElementById('speedBtn').addEventListener('click', () => {
    speedPopover.classList.toggle('open');
  });
  document.addEventListener('click', e => {
    if (!speedPopover.contains(e.target) && e.target.id !== 'speedBtn') {
      speedPopover.classList.remove('open');
    }
  });
  document.getElementById('speedSlider').addEventListener('input', e => {
    state.speed = parseInt(e.target.value);
    document.getElementById('speedVal').textContent = e.target.value;
  });

  // ── finish ──
  // ── doodle canvas ──
  const doodleCanvas = document.getElementById('doodleCanvas');
  const doodleCtx = doodleCanvas.getContext('2d');
  let doodleColor = '#ffffff', isDrawing = false, isEraser = false, doodleMode = false, brushSize = 4;
  let resultBgColor = '#ffffff';

  const doodleToggle = document.getElementById('doodleToggle');
  const colorBar = document.getElementById('colorBar');

  doodleToggle.addEventListener('click', () => {
    doodleMode = !doodleMode;
    doodleToggle.classList.toggle('active', doodleMode);
    colorBar.classList.toggle('open', doodleMode);
    doodleCanvas.classList.toggle('active', doodleMode);
  });

  document.getElementById('brushSize').addEventListener('input', e => {
    brushSize = parseInt(e.target.value);
  });

  document.getElementById('eraserBtn').addEventListener('click', () => {
    isEraser = !isEraser;
    document.getElementById('eraserBtn').classList.toggle('active', isEraser);
    if (isEraser) {
      document.getElementById('penColorPicker').parentElement.style.opacity = '0.4';
    } else {
      document.getElementById('penColorPicker').parentElement.style.opacity = '1';
    }
  });

  document.getElementById('penColorPicker').addEventListener('input', e => {
    doodleColor = e.target.value;
    isEraser = false;
    document.getElementById('eraserBtn').classList.remove('active');
    document.getElementById('penColorPicker').parentElement.style.opacity = '1';
  });

  document.getElementById('bgColorPicker').addEventListener('input', e => {
    resultBgColor = e.target.value;
    redrawResult();
  });

  function redrawResult() {
    resultCtx.fillStyle = resultBgColor;
    resultCtx.fillRect(0, 0, W, H);
    resultCtx.drawImage(outputCanvas, 0, 0);
  }

  function setupDoodleCanvas() {
    doodleCanvas.width = resultCanvas.width;
    doodleCanvas.height = resultCanvas.height;
  }

  function getDC(e) {
    const r = resultCanvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - r.left) * (doodleCanvas.width / r.width), y: (cy - r.top) * (doodleCanvas.height / r.height) };
  }

  function stroke(e) {
    if (!isDrawing) return;
    const c = getDC(e);
    doodleCtx.lineTo(c.x, c.y);
    if (isEraser) {
      doodleCtx.save(); doodleCtx.globalCompositeOperation = 'destination-out';
      doodleCtx.lineWidth = brushSize * 4; doodleCtx.lineCap = 'round'; doodleCtx.lineJoin = 'round';
      doodleCtx.stroke(); doodleCtx.restore();
    } else {
      doodleCtx.strokeStyle = doodleColor; doodleCtx.lineWidth = brushSize;
      doodleCtx.lineCap = 'round'; doodleCtx.lineJoin = 'round'; doodleCtx.stroke();
    }
  }
  function startD(e) { isDrawing = true; const c = getDC(e); doodleCtx.beginPath(); doodleCtx.moveTo(c.x, c.y); }

  doodleCanvas.addEventListener('mousedown', e => { if (doodleMode) startD(e); });
  doodleCanvas.addEventListener('mousemove', e => { if (doodleMode) stroke(e); });
  window.addEventListener('mouseup', () => { isDrawing = false; });
  doodleCanvas.addEventListener('touchstart', e => { if (doodleMode) startD(e); }, { passive: true });
  doodleCanvas.addEventListener('touchmove', e => { if (doodleMode) stroke(e); }, { passive: true });
  window.addEventListener('touchend', () => { isDrawing = false; });

  document.getElementById('finishBtn').addEventListener('click', () => {
    state.paused = true;
    resultBgColor = '#ffffff';
    redrawResult();
    setupDoodleCanvas();
    doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
    doodleMode = false;
    doodleToggle.classList.remove('active');
    colorBar.classList.remove('open');
    doodleCanvas.classList.remove('active');
    isEraser = false;
    document.getElementById('eraserBtn').classList.remove('active');
    document.getElementById('penColorPicker').parentElement.style.opacity = '1';
    document.getElementById('bgColorPicker').value = '#ffffff';
    document.getElementById('penColorPicker').value = '#ffffff';

    // Animated transition to result screen
    const overlay = document.getElementById('resultOverlay');
    overlay.classList.add('open');
    overlay.style.opacity = '1';
    if (typeof gsap !== 'undefined') {
      gsap.fromTo(overlay, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'power2.inOut',
        onComplete: () => { overlay.style.removeProperty('opacity'); }
      });
      gsap.fromTo('.result-title', { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, delay: 0.3, ease: 'power3.out',
        onComplete: function() { this.targets().forEach(el => el.removeAttribute('style')); }
      });
      gsap.fromTo('.result-buttons .rbtn', { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, delay: 0.4, stagger: 0.08, ease: 'power2.out',
        onComplete: function() { document.querySelectorAll('.result-buttons .rbtn').forEach(el => el.removeAttribute('style')); }
      });
      gsap.fromTo('.result-canvas-wrap', { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, delay: 0.35, ease: 'power2.out',
        onComplete: function() { this.targets().forEach(el => el.removeAttribute('style')); }
      });
    }
  });

  document.getElementById('scanAgainBtn').addEventListener('click', () => {
    document.getElementById('resultOverlay').classList.remove('open');
    // clear output canvas
    outputCtx.clearRect(0, 0, W, H);
    state.scanPos = 0;
    state.paused = false;
    // fully reset doodle state
    doodleMode = false;
    isDrawing = false;
    doodleToggle.classList.remove('active');
    colorBar.classList.remove('open');
    doodleCanvas.classList.remove('active');
    isEraser = false;
    document.getElementById('eraserBtn').classList.remove('active');
    document.getElementById('penColorPicker').parentElement.style.opacity = '1';
  });

  document.getElementById('downloadBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    const m = document.createElement('canvas');
    m.width = resultCanvas.width; m.height = resultCanvas.height;
    const mc = m.getContext('2d');
    mc.drawImage(resultCanvas, 0, 0);
    if (doodleCanvas.width > 0) mc.drawImage(doodleCanvas, 0, 0);
    const link = document.createElement('a');
    link.download = 'slit-scan-' + Date.now() + '.png';
    link.href = m.toDataURL('image/png');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  // ── upload to gallery ──
  const uploadModal = document.getElementById('uploadModal');
  const modalPreview = document.getElementById('modalPreview');
  const uploadStatus = document.getElementById('uploadStatus');

  document.getElementById('uploadGalleryBtn').addEventListener('click', () => {
    // Draw merged preview into modal canvas
    const m = document.createElement('canvas');
    m.width = resultCanvas.width; m.height = resultCanvas.height;
    const mc = m.getContext('2d');
    mc.drawImage(resultCanvas, 0, 0);
    if (doodleCanvas.width > 0) mc.drawImage(doodleCanvas, 0, 0);
    modalPreview.width = m.width;
    modalPreview.height = m.height;
    modalPreview.getContext('2d').drawImage(m, 0, 0);
    uploadStatus.textContent = '';
    uploadStatus.innerHTML = '';
    document.getElementById('artistName').value = '';
    document.querySelector('.modal-form').style.display = 'flex';
    document.getElementById('submitUpload').disabled = false;
    document.getElementById('submitUpload').textContent = '保存';
    uploadModal.classList.add('open');
  });

  document.getElementById('modalClose').addEventListener('click', () => {
    uploadModal.classList.remove('open');
  });
  uploadModal.addEventListener('click', e => {
    if (e.target === uploadModal) uploadModal.classList.remove('open');
  });

  document.getElementById('submitUpload').addEventListener('click', async () => {
    const name = document.getElementById('artistName').value.trim();
    if (!name) { uploadStatus.textContent = '请输入作品名称或作者名'; return; }

    const btn = document.getElementById('submitUpload');
    btn.disabled = true;
    btn.textContent = '正在保存...';
    uploadStatus.textContent = '';

    try {
      // Merge canvases
      const m = document.createElement('canvas');
      m.width = resultCanvas.width; m.height = resultCanvas.height;
      const mc = m.getContext('2d');
      mc.drawImage(resultCanvas, 0, 0);
      if (doodleCanvas.width > 0) mc.drawImage(doodleCanvas, 0, 0);

      // Save to local private gallery
      try {
        const url = m.toDataURL('image/jpeg', 0.85);
        const localScans = JSON.parse(localStorage.getItem('letsscan_local_gallery') || '[]');
        localScans.unshift({
          id: 'scan_' + Date.now(),
          name: name,
          imageUrl: url,
          createdAt: new Date().toISOString()
        });
        localStorage.setItem('letsscan_local_gallery', JSON.stringify(localScans.slice(0, 20)));
      } catch (storageErr) {
        console.warn('Local gallery storage quota or disabled:', storageErr);
      }

      // Smooth simulated upload feedback
      await new Promise(r => setTimeout(r, 200));

      document.querySelector('.modal-form').style.display = 'none';
      uploadStatus.innerHTML = '<div class="upload-success" style="text-align:center;padding:12px 0 6px;">' +
        '<p style="font-size:16px;font-weight:600;margin-bottom:6px;color:var(--ink);">🎉 保存成功！</p>' +
        '<p style="font-size:13px;color:#666;margin-bottom:16px;line-height:1.5;">作品已存入您的本地专属画廊<br><span style="font-size:12px;color:#999;">（数据保存在本机浏览器中，完全私密离线）</span></p>' +
        '<div style="display:flex;gap:10px;justify-content:center;">' +
          '<a href="../" style="font-family:inherit;font-size:13px;text-decoration:none;background:var(--red,#e8380d);color:#fff;border-radius:6px;padding:8px 16px;font-weight:500;">去首页画廊查看</a>' +
          '<button id="skipNotify" style="font-family:inherit;font-size:13px;background:var(--ink);color:#D5E4E8;border:none;border-radius:6px;padding:8px 16px;cursor:pointer;">留在本页</button>' +
        '</div>' +
      '</div>';

      document.getElementById('skipNotify').addEventListener('click', () => {
        uploadModal.classList.remove('open');
        document.querySelector('.modal-form').style.display = 'flex';
        btn.disabled = false; btn.textContent = '保存';
      });
    } catch (err) {
      console.error(err);
      uploadStatus.textContent = '保存失败，请重试';
      btn.disabled = false;
      btn.textContent = '保存';
    }
  });

  // ── drag ──
  const bedContainer = document.getElementById('bedContainer');

  function getCoords(e) {
    const rect = bedCanvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: (cx - rect.left) * (W / rect.width), y: (cy - rect.top) * (H / rect.height) };
  }

  bedContainer.addEventListener('mousedown', e => {
    const c = getCoords(e);
    state.isDragging = true;
    state.dragStartX = c.x - state.x;
    state.dragStartY = c.y - state.y;
    hideHint();
  });
  window.addEventListener('mousemove', e => {
    if (!state.isDragging) return;
    const c = getCoords(e);
    state.x = c.x - state.dragStartX;
    state.y = c.y - state.dragStartY;
  });
  window.addEventListener('mouseup', () => { state.isDragging = false; });

  bedContainer.addEventListener('wheel', e => {
    e.preventDefault();
    hideHint();
    state.scale = Math.max(0.1, Math.min(4, state.scale * (e.deltaY < 0 ? 1.08 : 0.92)));
  }, { passive: false });

  // touch drag
  let t1x = 0, t1y = 0, t1sx = 0, t1sy = 0, tStartDist = 0, tStartScale = 1;
  function hideHint() {
    const h = document.getElementById('gestureHint');
    if (h) h.style.opacity = '0';
  }

  bedContainer.addEventListener('touchstart', e => {
    hideHint();
    e.preventDefault();
    if (e.touches.length === 1) {
      const c = getCoords(e);
      state.isDragging = true;
      state.dragStartX = c.x - state.x;
      state.dragStartY = c.y - state.y;
    } else if (e.touches.length === 2) {
      state.isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      tStartDist = Math.sqrt(dx*dx + dy*dy);
      tStartScale = state.scale;
    }
  }, { passive: false });

  bedContainer.addEventListener('touchmove', e => {
    if (!state.isDragging && e.touches.length !== 2) return;
    e.preventDefault();
    if (e.touches.length === 1 && state.isDragging) {
      const c = getCoords(e);
      state.x = c.x - state.dragStartX;
      state.y = c.y - state.dragStartY;
    } else if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      state.scale = Math.max(0.1, Math.min(4, tStartScale * (dist / tStartDist)));
    }
  }, { passive: false });

  window.addEventListener('touchend', () => { state.isDragging = false; });

  // ── draw ──
  function drawBed(ctx, x, y, scale) {
    ctx.clearRect(0, 0, W, H);
    if (!state.imgLoaded) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(state.img, -state.img.width/2, -state.img.height/2);
    ctx.restore();
  }

  function drawLaser(ctx, pos) {
    ctx.save();
    const g = ctx.createLinearGradient(0, pos-8, 0, pos+8);
    g.addColorStop(0, 'rgba(232,56,13,0)');
    g.addColorStop(0.5, 'rgba(232,56,13,0.8)');
    g.addColorStop(1, 'rgba(232,56,13,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, pos-8, W, 16);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(0, pos-1, W, 2);
    ctx.restore();
  }

  // ── loop ──
  function loop() {
    const lerpT = 0.18;
    state.prevX += (state.x - state.prevX) * lerpT;
    state.prevY += (state.y - state.prevY) * lerpT;
    state.prevScale += (state.scale - state.prevScale) * lerpT;

    drawBed(bedCtx, state.x, state.y, state.scale);
    drawLaser(bedCtx, state.scanPos);

    if (state.scanning && !state.paused) {
      const step = state.speed;
      for (let k = 0; k < Math.max(1, Math.round(step)); k++) {
        const p = (k+1) / Math.max(1, Math.round(step));
        const ix = state.prevX + (state.x - state.prevX) * p;
        const iy = state.prevY + (state.y - state.prevY) * p;
        const is = state.prevScale + (state.scale - state.prevScale) * p;
        drawBed(offCtx, ix, iy, is);
        const sy = Math.round(state.scanPos + (k / Math.max(1, Math.round(step))) * step) % H;
        outputCtx.drawImage(offCanvas, 0, sy, W, 1, 0, sy, W, 1);
      }
      state.scanPos = (state.scanPos + step) % H;
    }

    requestAnimationFrame(loop);
  }

  loop();

})();
</script>

</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>小花老师教师节快乐</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(160deg, #fff8e7 0%, #fff3d6 30%, #e8f4fb 70%, #dbeeF9 100%);
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 40px;
  }

  /* 背景漂浮的数学元素 */
  .bg-item {
    position: fixed;
    z-index: 0;
    opacity: 0.35;
    font-weight: bold;
    color: #ffb703;
    user-select: none;
    pointer-events: none;
    animation: floatY 6s ease-in-out infinite;
  }

  .bg-item.blue { color: #8ecae6; }
  .bg-item.pink { color: #ffafcc; }

  @keyframes floatY {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-18px) rotate(8deg); }
  }

  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(6px);
    border-radius: 28px;
    padding: 36px 24px 30px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 10px 30px rgba(255, 183, 3, 0.18), 0 0 0 2px rgba(255,255,255,0.5) inset;
    border: 2px dashed #ffd166;
  }

  .decor-row {
    font-size: 22px;
    margin-bottom: 10px;
    letter-spacing: 6px;
  }

  h1 {
    font-size: clamp(24px, 6vw, 34px);
    color: #f77f00;
    line-height: 1.5;
    text-shadow: 2px 2px 0px rgba(255, 209, 102, 0.6);
    margin-bottom: 6px;
  }

  .subtitle {
    color: #5c7c9c;
    font-size: 14px;
    margin-bottom: 22px;
  }

  .apple {
    font-size: 42px;
    margin: 6px 0 18px;
    animation: bounce 2.2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .teacher-sticker {
    position: relative;
    width: 130px;
    margin: 4px auto 8px;
    animation: stickerJump 1.8s ease-in-out infinite;
  }

  .teacher-sticker img {
    width: 100%;
    display: block;
    filter: drop-shadow(0 6px 8px rgba(255, 183, 3, 0.25));
  }

  @keyframes stickerJump {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
  }

  #blessing-box {
    min-height: 90px;
    background: linear-gradient(135deg, #fff3cd 0%, #e3f2fd 100%);
    border-radius: 18px;
    padding: 18px 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 22px;
    border: 2px solid #ffe0a3;
  }

  #blessing-text {
    font-size: 17px;
    color: #4a4a4a;
    line-height: 1.7;
    font-weight: 500;
  }

  button#blessBtn {
    background: linear-gradient(135deg, #ffb703, #fb8500);
    color: #fff;
    border: none;
    padding: 14px 34px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 6px 0 #d97706, 0 8px 16px rgba(0,0,0,0.12);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    letter-spacing: 2px;
  }

  button#blessBtn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #d97706, 0 4px 10px rgba(0,0,0,0.12);
  }

  .math-line {
    margin-top: 22px;
    font-size: 14px;
    color: #8ecae6;
    font-weight: bold;
    letter-spacing: 1px;
  }

  footer {
    position: relative;
    z-index: 2;
    margin-top: 26px;
    text-align: center;
    color: #a0785a;
    font-size: 14px;
  }

  footer .heart {
    color: #ff6b6b;
  }

  /* 粒子层 */
  #particle-layer {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }

  .particle {
    position: absolute;
    top: -30px;
    font-size: 18px;
    opacity: 0.8;
    animation: fall linear forwards;
    user-select: none;
  }

  @keyframes fall {
    to {
      transform: translateY(110vh) rotate(360deg);
      opacity: 0.2;
    }
  }

  @media (max-width: 380px) {
    .card { padding: 28px 16px 24px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="particle-layer"></div>

<!-- 静态背景数学元素 -->
<div class="bg-item" style="top:8%; left:6%; font-size:34px;">＋</div>
<div class="bg-item blue" style="top:15%; right:8%; font-size:28px; animation-delay:1s;">7</div>
<div class="bg-item pink" style="top:75%; left:8%; font-size:30px; animation-delay:2s;">×</div>
<div class="bg-item" style="bottom:10%; right:10%; font-size:32px; animation-delay:0.5s;">π</div>
<div class="bg-item blue" style="top:40%; left:3%; font-size:26px; animation-delay:1.5s;">3</div>
<div class="bg-item pink" style="top:5%; left:45%; font-size:24px; animation-delay:2.5s;">−</div>
<div class="bg-item" style="bottom:6%; left:40%; font-size:26px; animation-delay:1.2s;">÷</div>

  </div>

  <div id="blessing-box">
    <p id="blessing-text">点击下方按钮，收下一句悄悄话～</p>
  </div>

  <button id="blessBtn">🎁 送上一句祝福</button>

  <div class="math-line">1 分耐心 + 1 分温柔 × 无数次陪伴 = 小花老师</div>
</div>

<footer>
  来自你的好朋友 <span class="heart">锦子</span> ❤️
</footer>

<script>
  const blessings = [
    "祝你带的班永远不上房揭瓦，祝你永远比小朋友们能'熬'",
    "每天要哄一群小屁孩还要教数学，你真的很厉害，给你点个赞！",
    "别的不说，你带的班肯定是全校最可爱又最会算数的一个！",
    "那些遇见你的小朋友何止走运，简直是走大运了！",
    "你教的那帮小豆丁，长大了肯定天天念叨'我们班主任超凶但超好'",
    "工作日超人，周末也要记得当回你自己，好好休息一下～",
    "1+1=2，但你对学生的耐心，我数学再好也算不出来！",
    "教师节这天，别当老师，就当自己是被宠的小朋友吧！",
    "教师节快乐，友情提示：今天收到的礼物要拍照发我看，馋了",
    "别人祝你桃李满天下，我只想祝你——身边永远有我这个赖着不走的朋友。"
  ];

  const btn = document.getElementById('blessBtn');
  const textEl = document.getElementById('blessing-text');
  let lastIndex = -1;

  function showBlessing() {
    let idx;
    do {
      idx = Math.floor(Math.random() * blessings.length);
    } while (idx === lastIndex && blessings.length > 1);
    lastIndex = idx;

    textEl.style.opacity = 0;
    setTimeout(() => {
      textEl.textContent = blessings[idx];
      textEl.style.transition = 'opacity 0.4s ease';
      textEl.style.opacity = 1;
    }, 200);

    burstParticles();
  }

  btn.addEventListener('click', showBlessing);

  // 粒子效果：爱心、苹果、数字随机飘落
  const particleChars = ['🍎', '❤️', '✏️', '⭐', '➕', '➖', '✖️', '➗', '📐'];
  const layer = document.getElementById('particle-layer');

  function createParticle() {
    const el = document.createElement('div');
    el.className = 'particle';
    el.textContent = particleChars[Math.floor(Math.random() * particleChars.length)];
    el.style.left = Math.random() * 100 + 'vw';
    const duration = 4 + Math.random() * 3;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (14 + Math.random() * 14) + 'px';
    layer.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000);
  }

  // 背景持续飘落少量粒子
  setInterval(createParticle, 900);

  // 点击按钮时集中爆发一批
  function burstParticles() {
    for (let i = 0; i < 10; i++) {
      setTimeout(createParticle, i * 60);
    }
  }

  // 首次进入也来一点小惊喜
  window.addEventListener('load', () => {
    for (let i = 0; i < 6; i++) {
      setTimeout(createParticle, i * 150);
    }
  });
</script>
